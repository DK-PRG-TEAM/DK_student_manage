# Source: GitHub starter workflow "Simple workflow" (MIT) — https://github.com/actions/starter-workflows/blob/main/ci/blank.yml
#
# Repaired by repocurator (feature 002):
#   - `push` and `pull_request` triggered on `main`; this repository's default
#     branch is `dev`, so the workflow had never run on a push to it.
#   - the test job ran the starter's placeholder echo, so a green check proved
#     only that the runner could print a sentence. It now builds and runs a
#     smoke test (tests/smoke_test.cpp) against the project's own map and
#     struct headers, since the repository had no test of any kind.
#   - a `Configure` / `Build` step that ran the project's own CMake build
#     (`cmake -S . -B build`, `cmake --build build`) was tried and removed:
#     src/Main/src/main.cpp does not compile, because
#     src/MyLinkedMap/include/MyLinkedListMapV2.h stores a `nullptr` sentinel
#     in an `Array<Value>` to mark a slot empty, which cannot compile for a
#     value type such as `Major` (src/Structs/include/struct.h is not a
#     pointer). That is a pre-existing defect in the project's own generic
#     container, unrelated to this pull request and out of scope for a
#     README/CI baseline change. The smoke test below does not exercise that
#     code path, so it still proves something real.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

# The workflow token is read-only by default.
# Grant extra permissions to a single job only when that job needs them.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that actions are pinned to full commit SHAs
        shell: bash
        run: |
          # Every `uses:` must reference a full 40-character commit SHA followed by a
          # version comment, for example:
          #   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          # Local actions (./path) and Docker images (docker://) are skipped.
          set -euo pipefail
          unpinned="$(grep -RnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows \
            | grep -vE "uses:[[:space:]]*['\"]?(\./|docker://)" \
            | grep -vE "@[0-9a-f]{40}['\"]?[[:space:]]+#[[:space:]]*v?[0-9]" || true)"
          if [ -n "$unpinned" ]; then
            echo "::error::Pin these actions to a full-length commit SHA with a version comment:"
            echo "$unpinned"
            exit 1
          fi
          echo "All actions are pinned to full-length commit SHAs."

  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build smoke test
        run: g++ -std=c++20 -Isrc/Structs/include -Isrc/MyLinkedMap/include tests/smoke_test.cpp -o smoke_test

      - name: Run smoke test
        run: ./smoke_test
